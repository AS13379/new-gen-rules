name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify generated profiles
        run: python3 scripts/build_profiles.py --check
      - name: Run repository validation
        run: python3 scripts/validate_repository.py
      - name: Verify routing report is current
        run: python3 scripts/check_report_current.py
      - name: Run strict mainland routing simulation
        run: python3 scripts/simulate_routing.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
